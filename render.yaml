# ===== render.yaml =====
# Render Blueprint — infrastructure-as-code for the backend.
# Deploy with: render blueprint apply (or connect repo in Render dashboard)
#
# What this automates:
#   - Django web service (Docker)
#   - PostgreSQL database
#
# What requires manual setup (set in Render Dashboard → Environment):
#   - REDIS_URL (Upstash free tier)
#   - BREVO_API_KEY (from Brevo dashboard)
#   - DJANGO_ADMIN_PASSWORD
#   - Cron jobs (check-escalations, check-backups)
#
# After first deploy, run in Render Shell:
#   python manage.py migrate --noinput
#   python manage.py create_initial_admin

services:
  - type: web
    name: actserv-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: actserv-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: actserv-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://onboarding-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://onboarding-frontend.vercel.app
      - key: DJANGO_ADMIN_EMAIL
        value: admin@actserv.local
      - key: DEFAULT_FROM_EMAIL
        value: karokirichard522@gmail.com
      - key: ADMIN_NOTIFICATION_EMAILS
        value: karokirichard522@gmail.com

databases:
  - name: actserv-db
    plan: free
    databaseName: actserv
    user: actserv

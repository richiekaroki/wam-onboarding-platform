# ===== render.yaml =====
# Render Blueprint — infrastructure-as-code for the backend.
# Deploy with: render blueprint apply (or connect repo in Render dashboard)
#
# What this automates:
#   - Django web service (Docker)
#   - PostgreSQL database
#
# What requires manual setup (free tier limitation):
#   - Redis (Upstash free tier — not supported by Render Blueprint)
#   - Celery worker (Render free tier only allows 1 service)
#
# After first deploy, run in Render Shell:
#   python manage.py migrate --noinput
#   python manage.py create_initial_admin

services:
  - type: web
    name: actserv-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: actserv-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: actserv-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://onboarding-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://onboarding-frontend.vercel.app
      - key: DJANGO_ADMIN_EMAIL
        value: admin@actserv.local
      - key: DEFAULT_FROM_EMAIL
        value: karokirichard522@gmail.com
      - key: ADMIN_NOTIFICATION_EMAILS
        value: karokirichard522@gmail.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: actserv-db
    plan: free
    databaseName: actserv
    user: actserv

cronJobs:
  - name: check-escalations
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    schedule: "0 9 * * *"
    startCommand: "python manage.py check_escalations"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: actserv-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: REDIS_URL
        sync: false
